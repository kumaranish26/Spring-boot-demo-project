<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Taking App</title>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --update-color: #00bcd4;
            --text: #ffffff;
            --secondary-text: #b2b2b2;
        }

        body {
            font-family: Arial;
            background-color: var(--bg-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        input, textarea {
            width: 300px;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        .note-card {
            background: #fff3cd;
            color: black;
            padding: 10px;
            margin: 10px;
            display: inline-block;
        }
    </style>
</head>

<body>

<h1>📝 Notes App</h1>

<input type="text" id="title" placeholder="Title"><br>
<textarea id="content" placeholder="Content"></textarea><br>

<button onclick="handleFormSubmit()" id="mainBtn">Add Note</button>
<button onclick="cancelEdit()" id="cancelBtn" style="display:none;">Cancel</button>

<div id="notesContainer"></div>

<script>

    // ✅ FIXED API URL (IMPORTANT)
    const API_URL = "http://localhost:8080/api/notes";

    let isEditing = false;
    let currentEditId = null;

    window.onload = fetchNotes;

    async function fetchNotes() {
        try {
            const res = await fetch(API_URL);
            const notes = await res.json();
            renderNotes(notes);
        } catch (err) {
            console.error("Fetch error:", err);
        }
    }

    function renderNotes(notes) {
        const container = document.getElementById("notesContainer");
        container.innerHTML = "";

        notes.forEach(note => {
            container.innerHTML += `
                <div class="note-card">
                    <b>${note.title}</b><br>
                    ${note.content}<br><br>

                    <button onclick="startEdit(${note.id}, '${note.title}', '${note.content}')">Edit</button>
                    <button onclick="deleteNote(${note.id})">Delete</button>
                </div>
            `;
        });
    }

    function handleFormSubmit() {
        if (isEditing) updateNote();
        else createNote();
    }

    async function createNote() {
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;

        await fetch(API_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ title, content })
        });

        resetForm();
        fetchNotes();
    }

    function startEdit(id, title, content) {
        isEditing = true;
        currentEditId = id;

        document.getElementById("title").value = title;
        document.getElementById("content").value = content;

        document.getElementById("mainBtn").innerText = "Update";
        document.getElementById("cancelBtn").style.display = "inline";
    }

    async function updateNote() {
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;

        await fetch(`${API_URL}/${currentEditId}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ title, content })
        });

        cancelEdit();
        fetchNotes();
    }

    async function deleteNote(id) {
        await fetch(`${API_URL}/${id}`, {
            method: "DELETE"
        });

        fetchNotes();
    }

    function cancelEdit() {
        isEditing = false;
        currentEditId = null;

        resetForm();

        document.getElementById("mainBtn").innerText = "Add Note";
        document.getElementById("cancelBtn").style.display = "none";
    }

    function resetForm() {
        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
    }

</script>

</body>
</html>
